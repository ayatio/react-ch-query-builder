<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJO Contact History Query Builder</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
        "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue",
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #0a0e17;
      color: #c8d6e5;
      line-height: 1.5;
    }
    
    #root {
      width: 100%;
      min-height: 100vh;
      background: #0a0e17;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ─── RESEARCH DATA (verified against Adobe Experience League + XDM GitHub) ───
    const RESEARCH = {
      joinKeys: {
        primary: "AE._experience.customerJourneyManagement.entities.channelDetails.messageID = MF._experience.customerJourneyManagement.messageExecution.messageID",
        note: "messageID is the canonical join key between ajo_entity_dataset and ajo_message_feedback_event_dataset (per Adobe official query examples).",
        dedup: "For batch journeys, combine journeyVersionID + journeyActionID + batchInstanceID for uniqueness.",
      },
      channels: {
        email: "https://ns.adobe.com/xdm/channels/email",
        push: "https://ns.adobe.com/xdm/channels/push",
        sms: "https://ns.adobe.com/xdm/channels/sms",
        directMail: "https://ns.adobe.com/xdm/channels/directMail",
      },
      feedbackStatuses: ["sent", "bounce", "delay", "error", "exclude", "delivered", "retry"],
      exclusionCodes: {
        ExperimentationHoldoutExclusion: { code: "050018", desc: "Qualified treatment is Holdout" },
        ExcludedForControlRules: { code: "050002", desc: "Violation of control rules (e.g. frequency cap)" },
        EmailNoMessageFoundForTreatment: { code: "050027", desc: "Experiment enabled, no message for qualified treatment" },
      },
      entityExperimentFields: {
        treatmentID: "_experience.customerJourneyManagement.entities.experiment.treatmentID",
        experimentId: "_experience.customerJourneyManagement.entities.experiment.experimentId",
        experimentName: "_experience.customerJourneyManagement.entities.experiment.experimentName",
        treatmentName: "_experience.customerJourneyManagement.entities.experiment.treatmentName",
      },
      entityChannelFields: {
        variantID: "_experience.customerJourneyManagement.entities.channelDetails.variantID",
        variantName: "_experience.customerJourneyManagement.entities.channelDetails.variantName",
        isMultiVariant: "_experience.customerJourneyManagement.entities.channelDetails.isMultiVariant",
        channel_id: "_experience.customerJourneyManagement.entities.channelDetails.channel._id",
      },
      feedbackExclusionField: "_experience.customerJourneyManagement.messageDeliveryfeedback.messageExclusion.reason",
    };

    // ─── CHANNEL + FLAVOR MAPS ───
    const CHANNEL_MAP = {
      EM: { label: "Email", uri: "https://ns.adobe.com/xdm/channels/email" },
      PU: { label: "Push", uri: "https://ns.adobe.com/xdm/channels/push" },
      SM: { label: "SMS", uri: "https://ns.adobe.com/xdm/channels/sms" },
      DM: { label: "Direct Mail", uri: "https://ns.adobe.com/xdm/channels/directMail" },
    };

    const FLAVOR_MAP = {
      target: { label: "Target", filter: "sent", desc: "Successfully sent messages" },
      control: { label: "Control (Holdout)", filter: "exclude_holdout", desc: "ExperimentationHoldoutExclusion exclusions" },
      experiment_A: { label: "Experiment Variant A", filter: "experiment", desc: "Specific treatment variant" },
      experiment_B: { label: "Experiment Variant B", filter: "experiment", desc: "Specific treatment variant" },
      all_sent: { label: "All Sent", filter: "sent", desc: "All sent regardless of variant" },
    };

    const SOURCE_MAP = {
      journey: "Journey",
      campaign: "Campaign",
    };

    // ─── SQL GENERATOR ───
    function generateSQL({ source, channel, flavor, dateFrom, dateTo, journeyName, audienceName, identityNs }) {
      const ch = CHANNEL_MAP[channel];
      const fl = FLAVOR_MAP[flavor];
      const isJourney = source === "journey";
      const aud = audienceName || "contact_history_audience";
      const ns = identityNs || "vtflPartnerid";

      // Build WHERE clauses
      const wheres = [];
      wheres.push(`  AE._experience.customerJourneyManagement.entities.channelDetails.channel._id = '${ch.uri}'`);

      if (isJourney) {
        wheres.push(`  AE._experience.customerJourneyManagement.entities.journey.journeyVersionID IS NOT NULL`);
        if (journeyName) {
          wheres.push(`  AE._experience.customerJourneyManagement.entities.journey.journeyName = '${journeyName}'`);
        }
      } else {
        wheres.push(`  AE._experience.customerJourneyManagement.entities.campaign.campaignVersionID IS NOT NULL`);
        if (journeyName) {
          wheres.push(`  AE._experience.customerJourneyManagement.entities.campaign.name = '${journeyName}'`);
        }
      }

      // Flavor-specific WHERE
      if (flavor === "target" || flavor === "all_sent") {
        wheres.push(`  MF._experience.customerJourneyManagement.messageDeliveryfeedback.feedbackStatus = 'sent'`);
      } else if (flavor === "control") {
        wheres.push(`  MF._experience.customerJourneyManagement.messageDeliveryfeedback.feedbackStatus = 'exclude'`);
        wheres.push(`  MF._experience.customerJourneyManagement.messageDeliveryfeedback.messageExclusion.reason = 'ExperimentationHoldoutExclusion'`);
      } else if (flavor.startsWith("experiment")) {
        wheres.push(`  MF._experience.customerJourneyManagement.messageDeliveryfeedback.feedbackStatus = 'sent'`);
        wheres.push(`  AE._experience.customerJourneyManagement.entities.experiment.treatmentName IS NOT NULL`);
        const variant = flavor === "experiment_A" ? "Treatment A" : "Treatment B";
        wheres.push(`  AE._experience.customerJourneyManagement.entities.experiment.treatmentName = '${variant}'`);
      }

      if (dateFrom) wheres.push(`  MF.timestamp >= '${dateFrom}T00:00:00.000Z'`);
      if (dateTo) wheres.push(`  MF.timestamp <= '${dateTo}T23:59:59.999Z'`);

      // Journey-specific SELECT fields
      const nameField = isJourney
        ? `AE._experience.customerJourneyManagement.entities.journey.journeyName`
        : `AE._experience.customerJourneyManagement.entities.campaign.name`;
      const actionField = isJourney
        ? `AE._experience.customerJourneyManagement.entities.journey.journeyActionName`
        : `AE._experience.customerJourneyManagement.entities.campaign.campaignActionName`;
      const versionField = isJourney
        ? `AE._experience.customerJourneyManagement.entities.journey.journeyVersionID`
        : `AE._experience.customerJourneyManagement.entities.campaign.campaignVersionID`;

      const selectQuery = `SELECT
    MF._experience.customerJourneyManagement.messageExecution.messageID    AS message_id,
    ${nameField}                                                           AS ${isJourney ? "journey_name" : "campaign_name"},
    ${actionField}                                                         AS action_name,
    ${versionField}                                                        AS version_id,
    AE._experience.customerJourneyManagement.entities.experiment.experimentName   AS experiment_name,
    AE._experience.customerJourneyManagement.entities.experiment.treatmentName    AS treatment_name,
    AE._experience.customerJourneyManagement.entities.channelDetails.variantName  AS variant_name,
    MF._experience.customerJourneyManagement.messageDeliveryfeedback.feedbackStatus AS feedback_status,
    MF._experience.customerJourneyManagement.messageProfile.channel._id    AS channel,
    MF.timestamp                                                           AS event_timestamp,
    MF._experience.customerJourneyManagement.messageExecution.journeyVersionID   AS mf_journey_version_id,
    MF._experience.customerJourneyManagement.messageExecution.batchInstanceID    AS batch_instance_id,
    MF.identityMap                                                         AS identity_map
  FROM ajo_entity_dataset AE
  INNER JOIN ajo_message_feedback_event_dataset MF
    ON AE._experience.customerJourneyManagement.entities.channelDetails.messageID
       = MF._experience.customerJourneyManagement.messageExecution.messageID
  WHERE
${wheres.join("\n  AND\n")}`;

      // Data Distiller audience wrapper
      const audienceSQL = `-- ═══════════════════════════════════════════════════════════
-- DATA DISTILLER AUDIENCE: ${aud}
-- Source: ${SOURCE_MAP[source]} | Channel: ${ch.label} | Flavor: ${fl.label}
-- Generated: ${new Date().toISOString().split("T")[0]}
-- ═══════════════════════════════════════════════════════════

-- STEP 1: Create the audience (run once)
CREATE AUDIENCE ${aud}
WITH (primary_identity='${ns}', identity_namespace='${ns}')
AS (
  SELECT DISTINCT
    -- Extract primary identity from identityMap
    -- Adjust the namespace key below to match your environment
    identity_entry.id AS ${ns}
  FROM (
    ${selectQuery.split("\n").map(l => "    " + l).join("\n")}
  ) base,
  UNNEST(base.identity_map['${ns}']) AS identity_entry
);

-- STEP 2: Refresh the audience (schedule this query)
-- INSERT OVERWRITE INTO ${aud}
-- SELECT DISTINCT identity_entry.id AS ${ns}
-- FROM ( ... same SELECT ... ) base,
-- UNNEST(base.identity_map['${ns}']) AS identity_entry;

-- ═══════════════════════════════════════════════════════════
-- NOTES:
-- • Data Distiller audiences expire after 30 days (external audiences).
-- • Use INSERT OVERWRITE INTO for scheduled refreshes.
-- • batchInstanceID distinguishes runs of batch journeys.
-- • Timestamps are in UTC in the feedback dataset.
-- ═══════════════════════════════════════════════════════════`;

      return { selectQuery, audienceSQL };
    }

    // ─── UI COMPONENT ───
    function AJOQueryGenerator() {
      const [source, setSource] = React.useState("journey");
      const [channel, setChannel] = React.useState("EM");
      const [flavor, setFlavor] = React.useState("target");
      const [dateFrom, setDateFrom] = React.useState("");
      const [dateTo, setDateTo] = React.useState("");
      const [journeyName, setJourneyName] = React.useState("");
      const [audienceName, setAudienceName] = React.useState("");
      const [identityNs, setIdentityNs] = React.useState("vtflPartnerid");
      const [activeTab, setActiveTab] = React.useState("generator");
      const [copied, setCopied] = React.useState(false);
      const codeRef = React.useRef(null);

      const { selectQuery, audienceSQL } = generateSQL({
        source, channel, flavor, dateFrom, dateTo, journeyName, audienceName, identityNs,
      });

      const handleCopy = (text) => {
        navigator.clipboard.writeText(text).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        });
      };

      return (
        <div style={{
          minHeight: "100vh",
          background: "#0a0e17",
          color: "#c8d6e5",
          padding: "20px",
        }}>
          <div style={{ maxWidth: 1400, margin: "0 auto" }}>
            {/* Header */}
            <div style={{
              marginBottom: 40,
              paddingBottom: 20,
              borderBottom: "1px solid #1e2d4a",
            }}>
              <h1 style={{
                fontSize: 32,
                fontWeight: 700,
                color: "#e8f0fe",
                marginBottom: 4,
              }}>
                AJO Contact History Query Builder
              </h1>
              <p style={{
                fontSize: 13,
                color: "#5a7a9a",
                marginTop: 8,
                fontWeight: 500,
              }}>
                DATA DISTILLER • QUERY SERVICE • PHASE 1+
              </p>
            </div>

            {/* Tabs */}
            <div style={{
              display: "flex",
              gap: 8,
              marginBottom: 24,
              borderBottom: "1px solid #1e2d4a",
            }}>
              {["generator", "research"].map(tab => (
                <button
                  key={tab}
                  onClick={() => setActiveTab(tab)}
                  style={{
                    padding: "10px 16px",
                    background: activeTab === tab ? "#131b2e" : "transparent",
                    color: activeTab === tab ? "#e8f0fe" : "#4a6a8a",
                    border: activeTab === tab ? "1px solid #2a4a6a" : "none",
                    borderRadius: "4px 4px 0 0",
                    cursor: "pointer",
                    fontSize: 13,
                    fontWeight: 600,
                    textTransform: "capitalize",
                    transition: "all 0.15s ease",
                  }}
                >
                  {tab}
                </button>
              ))}
            </div>

            {/* GENERATOR TAB */}
            {activeTab === "generator" && (
              <div style={{ display: "grid", gridTemplateColumns: "350px 1fr", gap: 24 }}>
                {/* Controls Panel */}
                <div style={{
                  background: "#131b2e",
                  border: "1px solid #1e2d4a",
                  borderRadius: 8,
                  padding: 20,
                  height: "fit-content",
                  position: "sticky",
                  top: 20,
                }}>
                  <h2 style={{ fontSize: 14, color: "#e8f0fe", marginBottom: 20, fontWeight: 700 }}>
                    CONFIGURATION
                  </h2>

                  <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
                    {/* Source */}
                    <div>
                      <Label>Source</Label>
                      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                        {["journey", "campaign"].map(s => (
                          <Pill
                            key={s}
                            active={source === s}
                            onClick={() => setSource(s)}
                            wide
                          >
                            {SOURCE_MAP[s]}
                          </Pill>
                        ))}
                      </div>
                    </div>

                    {/* Channel */}
                    <div>
                      <Label>Channel</Label>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 8 }}>
                        {Object.entries(CHANNEL_MAP).map(([code, ch]) => (
                          <Pill
                            key={code}
                            active={channel === code}
                            onClick={() => setChannel(code)}
                            wide
                          >
                            {ch.label}
                          </Pill>
                        ))}
                      </div>
                    </div>

                    {/* Flavor */}
                    <div>
                      <Label>Flavor</Label>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 8 }}>
                        {Object.entries(FLAVOR_MAP).map(([key, fl]) => (
                          <Pill
                            key={key}
                            active={flavor === key}
                            onClick={() => setFlavor(key)}
                            wide
                          >
                            {fl.label}
                          </Pill>
                        ))}
                      </div>
                    </div>

                    {/* Dates */}
                    <div>
                      <Label>From (YYYY-MM-DD)</Label>
                      <Input
                        type="date"
                        value={dateFrom}
                        onChange={e => setDateFrom(e.target.value)}
                        style={{ marginTop: 6 }}
                      />
                    </div>

                    <div>
                      <Label>To (YYYY-MM-DD)</Label>
                      <Input
                        type="date"
                        value={dateTo}
                        onChange={e => setDateTo(e.target.value)}
                        style={{ marginTop: 6 }}
                      />
                    </div>

                    {/* Journey/Campaign Name */}
                    <div>
                      <Label>{source === "journey" ? "Journey Name" : "Campaign Name"}</Label>
                      <Input
                        type="text"
                        placeholder="e.g. Renewal Reminder"
                        value={journeyName}
                        onChange={e => setJourneyName(e.target.value)}
                        style={{ marginTop: 6 }}
                      />
                    </div>

                    {/* Audience Name */}
                    <div>
                      <Label>Audience Name</Label>
                      <Input
                        type="text"
                        placeholder="contact_history_audience"
                        value={audienceName}
                        onChange={e => setAudienceName(e.target.value)}
                        style={{ marginTop: 6 }}
                      />
                    </div>

                    {/* Identity Namespace */}
                    <div>
                      <Label>Identity Namespace</Label>
                      <Input
                        type="text"
                        placeholder="vtflPartnerid"
                        value={identityNs}
                        onChange={e => setIdentityNs(e.target.value)}
                        style={{ marginTop: 6 }}
                      />
                    </div>
                  </div>
                </div>

                {/* Output Panel */}
                <div>
                  {/* SELECT Query */}
                  <div style={{ marginBottom: 32 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                      <h2 style={{ fontSize: 14, color: "#e8f0fe", fontWeight: 700 }}>
                        SELECT QUERY
                      </h2>
                      <button
                        onClick={() => handleCopy(selectQuery)}
                        style={{
                          padding: "6px 12px",
                          background: copied ? "#75e6a0" : "#1a3a2a",
                          color: copied ? "#0a0e17" : "#75e6a0",
                          border: "1px solid #2a5a4a",
                          borderRadius: 4,
                          cursor: "pointer",
                          fontSize: 11,
                          fontWeight: 600,
                          transition: "all 0.2s ease",
                        }}
                      >
                        {copied ? "✓ Copied" : "Copy"}
                      </button>
                    </div>
                    <Code>{selectQuery}</Code>
                  </div>

                  {/* Audience SQL */}
                  <div>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                      <h2 style={{ fontSize: 14, color: "#e8f0fe", fontWeight: 700 }}>
                        DATA DISTILLER AUDIENCE SQL
                      </h2>
                      <button
                        onClick={() => handleCopy(audienceSQL)}
                        style={{
                          padding: "6px 12px",
                          background: copied ? "#75e6a0" : "#1a3a2a",
                          color: copied ? "#0a0e17" : "#75e6a0",
                          border: "1px solid #2a5a4a",
                          borderRadius: 4,
                          cursor: "pointer",
                          fontSize: 11,
                          fontWeight: 600,
                          transition: "all 0.2s ease",
                        }}
                      >
                        {copied ? "✓ Copied" : "Copy"}
                      </button>
                    </div>
                    <Code>{audienceSQL}</Code>
                  </div>
                </div>
              </div>
            )}

            {/* RESEARCH TAB */}
            {activeTab === "research" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
                <ResearchCard
                  title="Join Key"
                  status="verified"
                >
                  <p><strong>Primary join:</strong> <code>messageID</code></p>
                  <p style={{ marginTop: 8 }}>{RESEARCH.joinKeys.note}</p>
                  <p style={{ marginTop: 8 }}><strong>Dedup note:</strong> {RESEARCH.joinKeys.dedup}</p>
                </ResearchCard>

                <div style={{ marginTop: 8 }}>
                  <h2 style={{ fontSize: 16, color: "#e8f0fe", marginBottom: 16, fontWeight: 700 }}>
                    Feedback Status Values
                  </h2>
                  <div style={{
                    display: "flex", flexWrap: "wrap", gap: 8,
                  }}>
                    {RESEARCH.feedbackStatuses.map(s => (
                      <span key={s} style={{
                        padding: "4px 12px",
                        background: "#131b2e",
                        border: "1px solid #1e2d4a",
                        borderRadius: 4,
                        fontSize: 12,
                        color: s === "sent" ? "#75e6a0" : s === "bounce" ? "#e67575" : s === "exclude" ? "#e6c875" : "#8ab4d8",
                        fontWeight: 600,
                      }}>{s}</span>
                    ))}
                  </div>
                </div>

                <div style={{ marginTop: 32 }}>
                  <h2 style={{ fontSize: 16, color: "#e8f0fe", marginBottom: 16, fontWeight: 700 }}>
                    Key Exclusion Codes
                  </h2>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                    <thead>
                      <tr style={{ borderBottom: "2px solid #1e2d4a" }}>
                        {["Code", "Reason", "Description"].map(h => (
                          <th key={h} style={{
                            textAlign: "left", padding: "10px 12px",
                            color: "#5a7a9a", fontWeight: 700,
                            textTransform: "uppercase", letterSpacing: "0.08em", fontSize: 10,
                          }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {Object.entries(RESEARCH.exclusionCodes).map(([name, v], i) => (
                        <tr key={name} style={{
                          borderBottom: "1px solid #141e30",
                          background: i % 2 === 0 ? "transparent" : "#0d1220",
                        }}>
                          <td style={{ padding: "8px 12px", color: "#e6c875", fontWeight: 600 }}>{v.code}</td>
                          <td style={{ padding: "8px 12px", color: "#e8f0fe" }}>{name}</td>
                          <td style={{ padding: "8px 12px", color: "#8ab4d8" }}>{v.desc}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div style={{
                  marginTop: 32,
                  padding: 16,
                  background: "#131b2e",
                  border: "1px solid #1e2d4a",
                  borderRadius: 8,
                  fontSize: 11,
                  color: "#5a7a9a",
                  lineHeight: 1.7,
                }}>
                  <strong style={{ color: "#8ab4d8" }}>Sources verified:</strong>{" "}
                  Adobe Experience League (Dataset Query Examples, Exclusion List, Data Distiller Audiences),
                  Adobe XDM GitHub repository (ajo-entity-mixins.schema.json),
                  Adobe Experience League Community (feedbackStatus enum values),
                  CJA Integration documentation (field mapping reference).
                  All field paths use the <code>_experience.customerJourneyManagement</code> prefix which maps to
                  the XDM namespace <code>https://ns.adobe.com/experience/customerJourneyManagement</code>.
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── Sub-components ───
    function Label({ children }) {
      return (
        <label style={{
          fontSize: 10, fontWeight: 700, color: "#5a7a9a",
          textTransform: "uppercase", letterSpacing: "0.1em",
        }}>{children}</label>
      );
    }

    function Input({ ...props }) {
      return (
        <input {...props} style={{
          padding: "8px 12px",
          background: "#0a0e17",
          border: "1px solid #1e2d4a",
          borderRadius: 4,
          color: "#c8d6e5",
          fontSize: 12,
          fontFamily: "inherit",
          outline: "none",
          width: "100%",
          boxSizing: "border-box",
          ...props.style,
        }} />
      );
    }

    function Pill({ children, active, onClick, wide }) {
      return (
        <button onClick={onClick} style={{
          padding: wide ? "6px 12px" : "6px 14px",
          background: active ? "#1a2744" : "transparent",
          color: active ? "#e8f0fe" : "#4a6a8a",
          border: `1px solid ${active ? "#2a4a6a" : "#1e2d4a"}`,
          borderRadius: 4,
          cursor: "pointer",
          fontSize: 11,
          fontWeight: 600,
          fontFamily: "inherit",
          textAlign: "left",
          flex: wide ? "1 1 100%" : undefined,
          transition: "all 0.15s ease",
        }}>{children}</button>
      );
    }

    function ResearchCard({ title, status, children }) {
      const colors = {
        verified: { bg: "#0a1f0a", border: "#1a4a1a", badge: "#75e6a0", badgeBg: "#0f2f0f", text: "VERIFIED" },
        warning: { bg: "#1f1a0a", border: "#4a3a1a", badge: "#e6c875", badgeBg: "#2f2a0f", text: "CAVEATS" },
      };
      const c = colors[status] || colors.verified;
      return (
        <div style={{
          background: "#0f1729",
          border: `1px solid ${c.border}`,
          borderRadius: 8,
          padding: 20,
          fontSize: 13,
          lineHeight: 1.8,
          color: "#a0b8d0",
        }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <h3 style={{ margin: 0, fontSize: 14, color: "#e8f0fe", fontWeight: 700 }}>{title}</h3>
            <span style={{
              padding: "2px 8px", borderRadius: 3, fontSize: 9, fontWeight: 800,
              background: c.badgeBg, color: c.badge, letterSpacing: "0.1em",
            }}>{c.text}</span>
          </div>
          <div style={{ "& code": { background: "#0a0e17", padding: "1px 5px", borderRadius: 3 } }}>
            {children}
          </div>
        </div>
      );
    }

    function Code({ children }) {
      return (
        <pre style={{
          background: "#0a0e17",
          border: "1px solid #141e30",
          borderRadius: 4,
          padding: "10px 14px",
          margin: "8px 0",
          fontSize: 11,
          lineHeight: 1.6,
          color: "#8ab4d8",
          overflow: "auto",
          whiteSpace: "pre-wrap",
        }}>{children}</pre>
      );
    }

    // ─── RENDER ───
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AJOQueryGenerator />);
  </script>
</body>
</html>
